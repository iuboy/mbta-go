name: CI

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify module
        run: go mod verify
      - name: Build all packages
        run: go build ./...

  fmt:
    name: Format & Module
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: gofmt check
        run: |
          # -s 与 Makefile fmt-check 对齐（缺 -s 时 CI 放行可简化代码，本地门禁拒绝）。
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::以下文件需要 gofmt -s -w："
            echo "$unformatted"
            exit 1
          fi
      - name: go mod tidy check
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "::error::go.mod/go.sum 未 tidy（运行 go mod tidy）"
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v7
        with:
          # 与本地开发环境对齐（v2.12.2 漏报 copyloopvar 等 2.15 已修规则；
          # 升级 action 版本线时同步 CONTRIBUTING 的本地安装指引）。
          version: v2.15.0
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run go vet
        run: go vet ./...
      - name: Run tests with coverage
        # -coverpkg 修正单包口径失真：conformance 套件对 core/protocol 的跨包
        # 覆盖（实测约 60%）不带上时，coverage.out 会把 protocol 报成 ~13%。
        run: go test -race -coverprofile=coverage.out -covermode=atomic -coverpkg=./... ./...
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

  proto:
    name: Proto (buf)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: buf lint
        run: buf lint
      - name: buf breaking (vs main)
        # 知情门禁而非阻断门禁（版本与破坏性策略，见 AGENTS.md/CONTRIBUTING）：
        # 本项目默认允许破坏性变更、无兼容要求——报告 wire 破坏面供 PR 审查
        # 确认是有意识的决策，不阻断合入。
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          REPO: ${{ github.repository }}
        run: buf breaking --against "https://github.com/$REPO.git#branch=main"
      # P10：生成代码漂移校验——确保 corepb/*.pb.go 与 .proto 一致，防止手动改生成代码或忘记 regen。
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Install protoc-gen-go
        # 版本必须 pin：插件把自身版本写进生成文件头（"protoc-gen-go vX.Y.Z"），
        # @latest 会随上游发版漂移，导致未改动 proto 时 diff 校验也失败（不可复现构建）。
        # 升级插件时须同步重新生成全部 corepb/*.pb.go。
        # v1.36.12：与 go.mod 的 protobuf 模块版本同步（prometheus/common v0.72.0
        # 硬性要求 v1.36.12；仍在 pin 的 1.36 minor 内，符合握手互操作 pin-minor 策略）。
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
      - name: buf generate
        run: buf generate
      - name: Check generated code is up to date
        run: git diff --exit-code corepb/

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Generate TLS certificates
        run: bash test/data/certificates/gen_certs.sh
      - name: Generate SM2 certificates
        # 证书 gitignored，须在跑集成测试前生成（gen_certs.go 基于源码路径定位输出目录）。
        run: go run test/data/ntls/gen_certs.go
      - name: Run integration tests
        # test/（黑盒 facade 集成/性能）+ v1/ntls e2e 均挂 integration tag，
        # 不带 tag 的 go test ./... 对它们只报 no test files（零回归保护）。
        # 集成测试同时产出跨包覆盖率（v1/ntls 面的单元覆盖极低，集成是主保护）。
        run: go test -race -count=1 -tags=integration -coverprofile=integration.out -coverpkg=./... ./test/ ./v1/ ./ntls/
      - name: Upload integration coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-coverage
          path: integration.out
          retention-days: 14

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 硬门禁：stdlib 漏洞由 go.mod 的 go 指令钉住（当前 go1.26.9 已含全部
    # 已披露修复），发现命中漏洞时升级该指令即可清零——扫描失败必须显式
    # 处理而非静默放行。旧 continue-on-error（"TLS 库必然命中"）的理由
    # 不成立，已移除。
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: govulncheck
        # 扫描器版本 pin（@latest 不可复现：上游发版可能引入行为/告警漂移，
        # 同一 commit 两次 CI 结果不一致）。升级时验证 ./... 零命中后更新。
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

  bench:
    name: Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run benchmarks
        # 产出 JSON 上传为 artifact：perf 基线对比在本地 benchstat 进行
        #（CI 无历史基线存储，趋势判定不在流水线内做——与 perf_bench_test
        # 尾注一致）。
        run: go test -bench=. -benchmem -count=1 -run=^$ ./... | tee bench.txt
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: bench.txt
          retention-days: 30

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    # integration 必须入列：v1/ntls 的单元覆盖极低（v1 ~2%），集成测试是
    # binding 面的主要回归保护——此前漏列导致集成失败仍可发版。
    needs: [build, fmt, lint, test, proto, vuln, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # 版本格式 v0.1.x-<rev> 恒含连字符——contains 判定会把每个正式版误标
          # 为 prerelease。rev 是版本号位而非 semver 预发布位，固定全量发布。
          prerelease: false
