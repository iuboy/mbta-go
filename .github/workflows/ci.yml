name: CI

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify module
        run: go mod verify
      - name: Build all packages
        run: go build ./...

  fmt:
    name: Format & Module
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::以下文件需要 gofmt -s -w："
            echo "$unformatted"
            exit 1
          fi
      - name: go mod tidy check
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "::error::go.mod/go.sum 未 tidy（运行 go mod tidy）"
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run go vet
        run: go vet ./...
      - name: Run tests with coverage
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

  proto:
    name: Proto (buf)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: buf lint
        run: buf lint
      - name: buf breaking (vs main)
        # 仅 PR 上检查（dev 是破坏性变更的开发分支——r3 协议重写期间
        # proto 全量替换，dev-vs-main 的 breaking 检查在此阶段必然失败；
        # 合入 main 前的 PR 检查是正确门槛）。
        if: github.event_name == 'pull_request'
        env:
          REPO: ${{ github.repository }}
        run: buf breaking --against "https://github.com/$REPO.git#branch=main"
      # P10：生成代码漂移校验——确保 corepb/*.pb.go 与 .proto 一致，防止手动改生成代码或忘记 regen。
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Install protoc-gen-go
        # 版本必须 pin：插件把自身版本写进生成文件头（"protoc-gen-go vX.Y.Z"），
        # @latest 会随上游发版漂移，导致未改动 proto 时 diff 校验也失败（不可复现构建）。
        # 升级插件时须同步重新生成全部 corepb/*.pb.go。
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
      - name: buf generate
        run: buf generate
      - name: Check generated code is up to date
        run: git diff --exit-code corepb/

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Generate TLS certificates
        run: bash test/data/certificates/gen_certs.sh
      - name: Generate SM2 certificates
        # 证书 gitignored，须在跑集成测试前生成（gen_certs.go 基于源码路径定位输出目录）。
        run: go run test/data/ntls/gen_certs.go
      - name: Run integration tests
        # test/（黑盒 facade 集成/性能）+ v1/ntls e2e 均挂 integration tag，
        # 不带 tag 的 go test ./... 对它们只报 no test files（零回归保护）。
        run: go test -race -count=1 -tags=integration ./test/ ./v1/ ./ntls/

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # govulncheck 对 stdlib crypto/tls 的调用链分析在 TLS 库中必然命中——
    # 本库的职责就是在 TLS 上构建协议，非本库可修复的传递依赖漏洞不应阻塞 CI。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  bench:
    name: Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run benchmarks
        run: go test -bench=. -benchmem -count=1 -run=^$ ./...

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, fmt, lint, test, proto, vuln]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
