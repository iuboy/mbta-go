syntax = "proto3";

package mbta.v1;

import "signal.proto";

option go_package = "github.com/iuboy/mbta-go/corepb;mbta";

// MBTA 协议消息集（r3 重设计）。
//
// 帧格式（core/frame.go）：[type(1)][flags(1)][varint length][payload]。
// type 高位为通道域：0x00-0x7F control / 0x80-0xFF data。
// 控制帧载荷 = 下列 control 消息（proto 编码）；BATCH/DGRAM 帧载荷 = Envelope。
//
// 枚举全部以 *_UNSPECIFIED = 0 起始，接收端 MUST 拒绝零值。

enum Profile {
  PROFILE_UNSPECIFIED = 0;
  PROFILE_INTL = 1;  // X25519 + HKDF-SHA256 + AES-256-GCM
  PROFILE_GM = 2;    // SM2 + HKDF-SM3 + SM4-GCM
}

enum AckMode {
  ACK_MODE_ENUM_UNSPECIFIED = 0;
  ACK_MODE_ACCEPTED_ONLY = 1;  // accepted 即终态
  ACK_MODE_DURABLE = 2;        // accepted 中间态，durable 终态
}

enum ResultLevel {
  RESULT_LEVEL_UNSPECIFIED = 0;
  RESULT_LEVEL_ACCEPTED = 1;  // 已入内存队列（durable 模式下非终态）
  RESULT_LEVEL_DURABLE = 2;   // 持久化完成（终态）
  RESULT_LEVEL_REJECTED = 3;  // 终态拒绝（内容非法/超限）
  RESULT_LEVEL_RELEASED = 4;  // 未处理可重投（携带 retry_hint；重投用新 seq）
}

enum Codec {
  CODEC_UNSPECIFIED = 0;
  CODEC_PROTO = 1;  // 默认
  CODEC_CBOR = 2;   // capability: cbor
}

enum Compression {
  COMPRESSION_UNSPECIFIED = 0;
  COMPRESSION_NONE = 1;
  COMPRESSION_GZIP = 2;
  COMPRESSION_ZSTD = 3;
  COMPRESSION_LZ4 = 4;
  // zstd + 服务端下发字典（capability: zstd_dict，DICT 帧提供"当前字典"；
  // 字典标识由 DICT 帧 dict_id 携带，Envelope 不重复）。
  COMPRESSION_ZSTD_DICT = 5;
}

// --- 握手（1 RTT）---

message Hello {
  Profile profile = 1;
  string agent_id = 2;
  map<string, string> meta = 3;  // hostname/os/version…；入链（transcript）按 deterministic 排序
  repeated string capabilities = 4;
  bytes client_eph = 5;   // 临时公钥：intl X25519 32B / gm SM2 65B 非压缩
  bytes token_proof = 6;  // HMAC(profileHash, key=token, msg=th_hello)；入链前置零
}

message Limits {
  uint64 max_frame_bytes = 1;  // Envelope wire 字节数上限（帧层）
  uint64 max_batch_bytes = 2;  // 解压后 batch payload 上限
}

message Credits {
  uint64 batches = 1;
  uint64 bytes = 2;  // 计量口径 = Envelope wire 字节
}

message HelloAck {
  bytes session_id = 1;  // 16B
  uint64 epoch = 2;      // 服务端按 agent 单调分配
  AckMode ack_mode = 3;
  repeated string selected_capabilities = 4;
  Limits limits = 5;
  Credits credits = 6;
  bytes server_eph = 7;
  bytes finished = 8;  // HMAC(handshake_key, th_full)；入链前置零
  int64 expiry_unix = 9;
}

message HelloNak {
  uint32 code = 1;  // 错误码注册表
  bool retryable = 2;
  uint32 retry_hint_ms = 3;
}

// --- 数据面 ---

// Envelope 是 BATCH/DGRAM 帧的 payload（明文可见部分仅 key_epoch/seq/compression）。
message Envelope {
  uint32 key_epoch = 1;  // 首版恒 0（rekey 预留）
  uint64 seq = 2;        // 连接级唯一计数器（BATCH/DGRAM 共享），从 1 起
  Compression compression = 3;
  bytes ciphertext = 4;  // AEAD(Batch 编码)
  // 外层 HMAC（capability: dual_integrity 协商启用时发送端填充）：
  // HMAC(profileHash, key=DualMACKey, msg=AD‖ciphertext)。未启用时发送端 MUST
  // 置空；接收端对"未启用却非空/启用却为空/校验失败"一律 envelope_open_failed。
  bytes mac = 5;
}

message Batch {
  uint64 seq = 1;  // 必须与 Envelope.seq 一致（AD 绑定 Envelope.seq；不一致 = batch_invalid）
  string correlation = 2;  // 可选对账句柄，RESULT 原样回显
  TraceContext trace = 3;  // 可选（trace_context 能力）
  uint32 events_count = 4;  // 事件数（Raw 快速路径不解码即知）
  bytes payload = 5;  // SignalBatch 编码（proto 或 cbor）
}

// --- 反馈（唯一反馈帧）---

message Result {
  uint64 ref_seq = 1;
  ResultLevel level = 2;
  uint32 code = 3;  // 错误码注册表（0=ok）
  string detail = 4;  // 仅日志；不对未认证方透传
  uint32 retry_hint_ms = 5;
  string correlation = 6;  // echo
}

// --- 流控（唯一发放帧）---

message Credit {
  uint64 batches = 1;
  uint64 bytes = 2;
}

// --- 连接管理 ---

message Close {
  string reason = 1;
  uint32 drain_timeout_ms = 2;  // 服务端 clamp [1000, 30000]
}

message Abort {
  uint32 code = 1;
  string detail = 2;
}

message Redirect {
  string leader_addr = 1;  // 经 ValidateHostPort 校验
  string leader_id = 2;
}

// --- 保活（仅 TCP binding；QUIC 用内置 keepalive）---

message Ping {
  int64 time_unix_ns = 1;
  bytes nonce = 2;
}

message Pong {
  int64 time_unix_ns = 1;
  bytes nonce = 2;
  string status = 3;
}

// --- 字典下发（capability: zstd_dict）---

// ZstdDict 是 DICT 帧（type 0x22，S→C）的载荷：服务端在 HELLO_ACK 之后立即下发，
// 客户端存储后即可用 COMPRESSION_ZSTD_DICT 压缩发送。
//
// 边界声明（r3 裁决）：字典内容不入握手 transcript（HELLO_ACK 的 finished 已签发
// 后无法追加入链）——字典经传输层 AEAD（TLS/TLCP）通道保护；字典被篡改最坏导致
// 解压失败（fail-closed），不构成安全降级。
message ZstdDict {
  uint32 dict_id = 1;  // 字典标识（服务端配置；客户端不解释）
  bytes dict = 2;      // 字典内容（zstd raw content dictionary）
}

// --- 运维命令下发（capability: control_commands；COMMAND 0x23 / COMMAND_ACK 0x24）---
// S→C 单向下发 + C→S 单帧应答。命令不存储转发：agent 离线即下发失败，
// 由调用方重发。command_id 为幂等键（agent 对重复 ID 不重执行）。

enum CommandType {
  COMMAND_TYPE_UNSPECIFIED = 0;
  COMMAND_TYPE_CONFIG_APPLY = 1;    // payload = 期望配置（JSON/TOML 文本）
  COMMAND_TYPE_SERVICE_RESTART = 2; // 无参数；agent 落盘后自重启进程
  COMMAND_TYPE_UPGRADE = 3;         // payload = 升级描述（version/url/sha256）
  COMMAND_TYPE_UNINSTALL = 4;       // 无参数；需服务端独立权限 + 二次确认
  COMMAND_TYPE_RULESET_APPLY = 5;   // payload = 安全检测规则包签名信封（rulesign.Envelope）；
                                    // agent 验签通过后落盘规则包文件并热重载检测引擎，
                                    // 验签失败 REJECTED（不落盘不重载）
}

message ControlCommand {
  string command_id = 1;        // ULID 幂等键
  CommandType type = 2;
  bytes payload = 3;            // 命令参数；无参数命令为空
  int64 issued_at_unix = 4;     // 服务端签发时间（unix 秒）
}

enum CommandAckCode {
  COMMAND_ACK_CODE_UNSPECIFIED = 0;
  COMMAND_ACK_CODE_APPLIED = 1;  // 已执行成功
  COMMAND_ACK_CODE_ACCEPTED = 2; // 已受理（异步执行中，如重启排空）
  COMMAND_ACK_CODE_REJECTED = 3; // 拒绝（不支持/校验失败/防卸载保护）
  COMMAND_ACK_CODE_FAILED = 4;   // 执行失败（message 携带原因）
}

message ControlCommandAck {
  string command_id = 1;
  CommandAckCode code = 2;
  string message = 3;           // 人读结果/失败原因
}
